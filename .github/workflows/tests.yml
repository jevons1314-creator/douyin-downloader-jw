name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: python -m unittest discover -s dashboard -p 'test_dashboard.py' -q

  agent-discovery:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --prefix .qa-agent-deps --ignore-scripts --no-audit --no-fund @openai/codex@0.163.0 @deepseek-ai/dsh-skill-filesystem@0.2.0-rc.2
      - run: node tests/check_agent_discovery.mjs .qa-agent-deps/node_modules
